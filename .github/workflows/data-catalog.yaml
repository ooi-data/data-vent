name: Create Intake Data Catalog

on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches:
      - main
    paths:
      - ooi_harvester/metadata/**
  workflow_dispatch:

jobs:
  catalog-creation:
    runs-on: ubuntu-latest
    env:
      OOI_USERNAME: ${{ secrets.OOI_USERNAME }}
      OOI_TOKEN: ${{ secrets.OOI_TOKEN }}
      AWS_KEY: ${{ secrets.AWS_KEY }}
      AWS_SECRET: ${{ secrets.AWS_SECRET }}
      GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
      GH_PAT: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/data-vent
          token: ${{ secrets.GH_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"  # matches the prefect image
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install package
        run: uv pip install .
      - name: Run Catalog Creation
        run: ooi-data-catalog catalog --create
