name: Metadata Harvest

on:
  schedule:
    - cron: "0 11 * * *"
  push:
    branches:
      - main
    paths:
      - data_vent/metadata/**
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    env:
      OOI_USERNAME: ${{ secrets.OOI_USERNAME }}
      OOI_TOKEN: ${{ secrets.OOI_TOKEN }}
      AWS_KEY: ${{ secrets.AWS_KEY }}
      AWS_SECRET: ${{ secrets.AWS_SECRET }}
      GOOGLE_SERVICE_JSON: ${{ secrets.GOOGLE_SERVICE_JSON }}
      GH_PAT: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ooi-data/data-vent
          token: ${{ secrets.GH_TOKEN }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"  # matches the prefect image
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install package
        run: uv pip install .
      - name: Run Harvest
        run: ooi-metadata-harvest --cava-assets --ooinet-inventory --ooi-streams --global-ranges --instrument-catalog --legacy-catalog
